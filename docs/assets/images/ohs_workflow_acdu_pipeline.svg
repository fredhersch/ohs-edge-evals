<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" style="background-color: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Crisp, subtle arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14b8a6" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="620" fill="#0b0f17" />
  <rect width="1198" height="618" x="1" y="1" rx="8" fill="none" stroke="#1f293d" stroke-width="1" />

  <!-- =================================================================== -->
  <!-- FIGURE HEADER (ACADEMIC / RESEARCH STYLE)                           -->
  <!-- =================================================================== -->
  <g transform="translate(36, 28)">
    <text x="0" y="16" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="0.2">
      Figure 1 | Open Health Stack: Division of Responsibility in Edge Clinical Reasoning
    </text>
    <text x="0" y="34" font-size="11" font-weight="400" fill="#94a3b8">
      Separation of patient context projection (SQL-on-FHIR), deterministic logic ($apply), aCDU safety floor, and on-device SLM synthesis.
    </text>

    <!-- Subtle Research Badge -->
    <g transform="translate(1010, 0)">
      <rect width="118" height="24" rx="4" fill="#161e2e" stroke="#2d3748" stroke-width="1" />
      <text x="10" y="16" font-size="10.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.4">OHS RESEARCH</text>
    </g>
  </g>

  <line x1="36" y1="76" x2="1164" y2="76" stroke="#1e293b" stroke-width="1" />

  <!-- =================================================================== -->
  <!-- COLUMN 1: PATIENT RECORD (FHIR R4 BUNDLE)                           -->
  <!-- =================================================================== -->
  <g transform="translate(36, 96)">
    <!-- Main Card -->
    <rect width="210" height="490" rx="8" fill="#111827" stroke="#283548" stroke-width="1" />
    
    <!-- Title -->
    <rect x="12" y="12" width="186" height="26" rx="4" fill="#1a2234" />
    <text x="20" y="29" font-size="10.5" font-weight="700" fill="#93c5fd" letter-spacing="0.3">INPUT: PATIENT EHR STATE</text>

    <text x="14" y="58" font-size="12" font-weight="700" fill="#f8fafc">HL7 FHIR R4 Bundle</text>
    <text x="14" y="73" font-size="10" fill="#94a3b8">Raw clinical data (~1,840 tokens)</text>

    <!-- Structured List of FHIR Resources -->
    <g transform="translate(12, 88)">
      <!-- Patient -->
      <rect width="186" height="44" rx="5" fill="#172033" stroke="#232f42" stroke-width="1" />
      <text x="10" y="18" font-size="11" font-weight="600" fill="#f1f5f9">Patient Resource</text>
      <text x="10" y="32" font-size="10" font-family="monospace" fill="#94a3b8">Age: 14m • Female • Kenya</text>

      <!-- Observations: Vitals -->
      <rect y="52" width="186" height="56" rx="5" fill="#172033" stroke="#232f42" stroke-width="1" />
      <text x="10" y="70" font-size="11" font-weight="600" fill="#f1f5f9">Observation: Vitals</text>
      <text x="10" y="84" font-size="10" font-family="monospace" fill="#94a3b8">RR 56 bpm (Fast breathing)</text>
      <text x="10" y="96" font-size="10" font-family="monospace" fill="#cbd5e1">Temp: 39.4°C • Indrawing (+)</text>

      <!-- Observation: Lab -->
      <rect y="116" width="186" height="44" rx="5" fill="#172033" stroke="#232f42" stroke-width="1" />
      <text x="10" y="134" font-size="11" font-weight="600" fill="#f1f5f9">DiagnosticReport: Lab</text>
      <text x="10" y="148" font-size="10" font-family="monospace" fill="#94a3b8">mRDT: P. falciparum (+)</text>

      <!-- Condition: Convulsion -->
      <rect y="168" width="186" height="56" rx="5" fill="#20151c" stroke="#5a232e" stroke-width="1" />
      <text x="10" y="186" font-size="11" font-weight="600" fill="#fca5a5">Condition: Danger Sign</text>
      <text x="10" y="200" font-size="10" font-family="monospace" fill="#fca5a5">Convulsion (degedege)</text>
      <text x="10" y="212" font-size="9.5" font-family="monospace" fill="#e2e8f0">Status: Post-ictal lethargy</text>

      <!-- Encounters -->
      <rect y="232" width="186" height="44" rx="5" fill="#172033" stroke="#232f42" stroke-width="1" />
      <text x="10" y="250" font-size="11" font-weight="600" fill="#f1f5f9">Encounter History</text>
      <text x="10" y="264" font-size="10" font-family="monospace" fill="#94a3b8">12 prior visits recorded</text>
    </g>

    <!-- Note on Naive RAG -->
    <g transform="translate(12, 382)">
      <rect width="186" height="96" rx="5" fill="#181318" stroke="#3b2027" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-weight="700" fill="#f87171">WHY NOT SEND RAW TO LLM?</text>
      <text x="10" y="34" font-size="9.5" fill="#cbd5e1">• 1,840 tokens overflows 2B RAM</text>
      <text x="10" y="48" font-size="9.5" fill="#cbd5e1">• Unstructured RAG causes severe</text>
      <text x="10" y="62" font-size="9.5" fill="#cbd5e1">  diagnostic hallucinations</text>
      <text x="10" y="76" font-size="9.5" fill="#cbd5e1">• 10% baseline collision score</text>
    </g>
  </g>

  <!-- Connectors to Channel A & Channel B -->
  <path d="M 246 195 L 272 195 L 272 170 L 296 170" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 246 410 L 272 410 L 272 410 L 296 410" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- TRACK 1 (TOP): CHANNEL A - CONTEXT PROJECTION                       -->
  <!-- =================================================================== -->
  <g transform="translate(298, 96)">
    <rect width="250" height="195" rx="8" fill="#111827" stroke="#283548" stroke-width="1" />
    
    <rect x="12" y="12" width="226" height="24" rx="4" fill="#0f2524" stroke="#134e4a" stroke-width="1" />
    <text x="20" y="28" font-size="10.5" font-weight="700" fill="#2dd4bf" letter-spacing="0.3">CHANNEL A: CONTEXT PROJECTION</text>

    <text x="14" y="56" font-size="12" font-weight="700" fill="#f8fafc">SQL-on-FHIR Views</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">+ Markdown Briefing Templates</text>

    <!-- Scope Box -->
    <g transform="translate(12, 80)">
      <rect width="226" height="60" rx="4" fill="#161f30" stroke="#222f44" stroke-width="1" />
      <text x="10" y="17" font-size="9.5" fill="#cbd5e1">• Flattens nested JSON into relational views</text>
      <text x="10" y="32" font-size="9.5" fill="#cbd5e1">• Computes relative ages and event dates</text>
      <text x="10" y="47" font-size="9.5" fill="#cbd5e1">• Normalizes vitals into longitudinal tables</text>
    </g>

    <!-- Output Pill -->
    <g transform="translate(12, 148)">
      <rect width="226" height="34" rx="4" fill="#0f2b26" stroke="#14b8a6" stroke-width="0.8" />
      <text x="10" y="15" font-size="10" font-weight="700" fill="#5eead4">Output: Markdown Briefing</text>
      <text x="10" y="27" font-size="9.5" font-family="monospace" fill="#a7f3d0">180 tokens (10x token reduction)</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- TRACK 2 (BOTTOM): CHANNEL B - DETERMINISTIC LOGIC ENGINE            -->
  <!-- =================================================================== -->
  <g transform="translate(298, 305)">
    <rect width="250" height="281" rx="8" fill="#111827" stroke="#283548" stroke-width="1" />
    
    <rect x="12" y="12" width="226" height="24" rx="4" fill="#13233c" stroke="#1d4ed8" stroke-width="1" />
    <text x="20" y="28" font-size="10.5" font-weight="700" fill="#93c5fd" letter-spacing="0.3">CHANNEL B: DETERMINISTIC LOGIC</text>

    <text x="14" y="56" font-size="12" font-weight="700" fill="#f8fafc">OHS Workflow Library ($apply)</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">PlanDefinitions evaluated in FHIRPath / CQL</text>

    <!-- Evaluations -->
    <g transform="translate(12, 80)">
      <rect width="226" height="88" rx="4" fill="#161f30" stroke="#222f44" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="600" fill="#93c5fd">Rule Evaluations (Kotlin/CQL Engine):</text>
      <text x="10" y="32" font-size="9" font-family="monospace" fill="#cbd5e1">• Malaria: mRDT == '+' → FIRES</text>
      <text x="10" y="47" font-size="9" font-family="monospace" fill="#cbd5e1">• Pneumonia: RR&gt;50 + Indraw → FIRES</text>
      <text x="10" y="62" font-size="9" font-family="monospace" fill="#cbd5e1">• Danger: Convulsions == true → FIRES</text>
      <text x="10" y="77" font-size="8.5" fill="#94a3b8">Determinism: 100% recall @ 0.6ms</text>
    </g>

    <!-- Output Codes -->
    <g transform="translate(12, 176)">
      <rect width="226" height="92" rx="4" fill="#141c2c" stroke="#283548" stroke-width="1" />
      <text x="10" y="16" font-size="10" font-weight="700" fill="#93c5fd">Output: CarePlan Action Codes</text>
      
      <rect x="8" y="24" width="210" height="18" rx="3" fill="#1e293b" />
      <text x="14" y="37" font-size="9" font-family="monospace" fill="#cbd5e1">IMCI-ACT-MAL-AL (Oral AL)</text>

      <rect x="8" y="45" width="210" height="18" rx="3" fill="#1e293b" />
      <text x="14" y="58" font-size="9" font-family="monospace" fill="#cbd5e1">IMCI-REC-PNEU-AMOX (Oral Amox)</text>

      <rect x="8" y="66" width="210" height="18" rx="3" fill="#2d151c" stroke="#7f1d1d" stroke-width="0.8" />
      <text x="14" y="79" font-size="9" font-family="monospace" font-weight="700" fill="#fca5a5">IMCI-REC-DANGER (Convulsion)</text>
    </g>
  </g>

  <!-- Connectors to Channel C -->
  <path d="M 548 190 L 572 190 L 572 230 L 594 230" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 548 440 L 572 440 L 572 380 L 594 380" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- CHANNEL C: aCDU SAFETY FLOOR & DEONTIC CLAMPING                     -->
  <!-- =================================================================== -->
  <g transform="translate(596, 96)">
    <rect width="280" height="490" rx="8" fill="#111827" stroke="#283548" stroke-width="1" />
    
    <rect x="12" y="12" width="256" height="24" rx="4" fill="#1d1e38" stroke="#4338ca" stroke-width="1" />
    <text x="20" y="28" font-size="10.5" font-weight="700" fill="#c7d2fe" letter-spacing="0.3">CHANNEL C: aCDU SAFETY FLOOR</text>

    <text x="14" y="56" font-size="12" font-weight="700" fill="#f8fafc">Unit Mapping &amp; Deontic Clamping</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">Resolves contradictions before prompting SLM</text>

    <!-- Sub-step 1: aCDU Unit Mapping -->
    <g transform="translate(12, 80)">
      <rect width="256" height="84" rx="4" fill="#161f30" stroke="#222f44" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#c7d2fe">1. Map Codes → Audited aCDUs (≤180 tok)</text>
      <text x="10" y="30" font-size="9" fill="#94a3b8">Each unit fuses mandated actions with prohibitions:</text>
      
      <rect x="8" y="36" width="240" height="20" rx="3" fill="#132a24" />
      <text x="14" y="50" font-size="8.5" fill="#6ee7b7">✓ Mandate: Weight-based dosing &amp; referral</text>

      <rect x="8" y="59" width="240" height="20" rx="3" fill="#2d151c" stroke="#7f1d1d" stroke-width="0.6" />
      <text x="14" y="73" font-size="8.5" fill="#fca5a5">🛑 Prohibited: Negative boundary constraints</text>
    </g>

    <!-- Sub-step 2: Deontic Veto Resolution -->
    <g transform="translate(12, 172)">
      <rect width="256" height="154" rx="4" fill="#181926" stroke="#3730a3" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#c7d2fe">2. Tier-1 Deontic Conflict Resolver</text>
      
      <!-- Invariant Box -->
      <rect x="8" y="24" width="240" height="26" rx="3" fill="#10131d" />
      <text x="14" y="41" font-size="10.5" font-family="monospace" font-weight="700" fill="#a5b4fc">R_safe = R_raw \ N_Tier1</text>

      <text x="10" y="66" font-size="9" font-weight="600" fill="#fca5a5">• Emergency Rule Triggered (Tier 1):</text>
      <rect x="8" y="72" width="240" height="36" rx="3" fill="#261217" stroke="#7f1d1d" stroke-width="0.8" />
      <text x="12" y="86" font-size="8.5" font-family="monospace" fill="#fca5a5">"STOP: Do NOT give oral medications</text>
      <text x="12" y="98" font-size="8.5" font-family="monospace" fill="#fca5a5">or fluids (fatal aspiration hazard)"</text>

      <text x="10" y="122" font-size="9" font-weight="700" fill="#f87171">• Deterministic Pruning Effect:</text>
      <text x="10" y="136" font-size="8.8" fill="#e2e8f0">Oral AL and oral Amox are removed from prompt.</text>
      <text x="10" y="148" font-size="8.5" fill="#94a3b8">The SLM never sees the oral dosing options.</text>
    </g>

    <!-- Sub-step 3: Clamped Context Assembly -->
    <g transform="translate(12, 334)">
      <rect width="256" height="144" rx="4" fill="#141c2c" stroke="#283548" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#93c5fd">3. Clamped Prompt Context Assembly</text>
      
      <rect x="8" y="24" width="240" height="30" rx="3" fill="#102123" />
      <text x="12" y="38" font-size="8.5" font-weight="600" fill="#5eead4">[Channel A] Markdown Patient Summary</text>
      <text x="12" y="49" font-size="8" fill="#94a3b8">Age 14m, RR 56, Temp 39.4°C, 12 past encounters</text>

      <rect x="8" y="58" width="240" height="38" rx="3" fill="#221524" />
      <text x="12" y="72" font-size="8.5" font-weight="600" fill="#f0abfc">[Channel C] Clamped aCDU Directives</text>
      <text x="12" y="83" font-size="8" fill="#cbd5e1">• Recovery position; keep airway clear</text>
      <text x="12" y="93" font-size="8" fill="#cbd5e1">• Immediate hospital transfer; no oral fluids</text>

      <rect x="8" y="102" width="240" height="32" rx="3" fill="#10231d" stroke="#15803d" stroke-width="0.8" />
      <text x="12" y="116" font-size="9" font-weight="700" fill="#86efac">Safety Invariant Maintained</text>
      <text x="12" y="127" font-size="8" fill="#bbf7d0">Aspiration hallucination mathematically barred</text>
    </g>
  </g>

  <!-- Connector to Channel D -->
  <path d="M 876 341 L 900 341" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- CHANNEL D: EDGE SLM SYNTHESIS                                       -->
  <!-- =================================================================== -->
  <g transform="translate(902, 96)">
    <rect width="262" height="490" rx="8" fill="#111827" stroke="#283548" stroke-width="1" />
    
    <rect x="12" y="12" width="238" height="24" rx="4" fill="#0f261f" stroke="#15803d" stroke-width="1" />
    <text x="20" y="28" font-size="10.5" font-weight="700" fill="#86efac" letter-spacing="0.3">CHANNEL D: EDGE SLM SYNTHESIS</text>

    <text x="14" y="56" font-size="12" font-weight="700" fill="#f8fafc">Box 2: On-Device 2B SLM</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">Gemma4 2B / MedGemma 4B (&lt;1.9 GB RAM)</text>

    <!-- Role description -->
    <g transform="translate(12, 80)">
      <rect width="238" height="52" rx="4" fill="#161f30" stroke="#222f44" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="600" fill="#cbd5e1">The Last-Mile Edge Communicator:</text>
      <text x="10" y="30" font-size="9" fill="#94a3b8">• Does not invent diagnoses or pick protocols</text>
      <text x="10" y="44" font-size="9" fill="#94a3b8">• Translates clamped safe directives into speech</text>
    </g>

    <!-- 3-Bullet Frontline Output Script -->
    <g transform="translate(12, 140)">
      <rect width="238" height="236" rx="4" fill="#131e29" stroke="#1e2e3d" stroke-width="1" />
      <text x="10" y="17" font-size="9.5" font-weight="700" fill="#86efac">3-BULLET CHW ACTION SCRIPT:</text>

      <!-- Bullet 1 -->
      <g transform="translate(8, 26)">
        <rect width="222" height="54" rx="3" fill="#172232" />
        <text x="8" y="14" font-size="9" font-weight="700" fill="#f1f5f9">1. Recovery Position &amp; Airway</text>
        <text x="8" y="27" font-size="8" fill="#94a3b8">"Turn child onto left side with neck clear.</text>
        <text x="8" y="38" font-size="8" fill="#94a3b8">Loosen tight clothing to keep airway open."</text>
      </g>

      <!-- Bullet 2 -->
      <g transform="translate(8, 86)">
        <rect width="222" height="60" rx="3" fill="#24151b" stroke="#7f1d1d" stroke-width="0.8" />
        <text x="8" y="14" font-size="9" font-weight="700" fill="#fca5a5">2. Strict Oral Medication Prohibition</text>
        <text x="8" y="27" font-size="8" fill="#fca5a5">"Do NOT give oral pills, water, or herbs.</text>
        <text x="8" y="38" font-size="8" fill="#fca5a5">Giving oral fluids to a drowsy child causes</text>
        <text x="8" y="49" font-size="8" fill="#fca5a5">fatal pulmonary choking."</text>
      </g>

      <!-- Bullet 3 -->
      <g transform="translate(8, 152)">
        <rect width="222" height="54" rx="3" fill="#172232" />
        <text x="8" y="14" font-size="9" font-weight="700" fill="#f1f5f9">3. Urgent Facility Transfer</text>
        <text x="8" y="27" font-size="8" fill="#94a3b8">"Accompany caregiver immediately to Malindi</text>
        <text x="8" y="38" font-size="8" fill="#94a3b8">Hospital for injectable anticonvulsants."</text>
      </g>

      <text x="8" y="222" font-size="8.5" font-weight="600" fill="#38bdf8">Result: 10% → 60% (6x Accuracy Lift)</text>
    </g>

    <!-- Bottom Metric Card -->
    <g transform="translate(12, 384)">
      <rect width="238" height="94" rx="4" fill="#0f1b20" stroke="#164e63" stroke-width="1" />
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#38bdf8">Empirical Safety Guarantees:</text>
      <text x="10" y="32" font-size="9" fill="#cbd5e1">• Safety Floor Recall: <tspan fill="#86efac" font-weight="600">100% Deterministic</tspan></text>
      <text x="10" y="47" font-size="9" fill="#cbd5e1">• Fatal Aspiration Risk: <tspan fill="#86efac" font-weight="600">0.0% (Zero Error)</tspan></text>
      <text x="10" y="62" font-size="9" fill="#cbd5e1">• Memory Footprint: <tspan fill="#86efac" font-weight="600">&lt;1.9 GB RAM</tspan></text>
      <text x="10" y="77" font-size="9" fill="#cbd5e1">• Latency: <tspan fill="#86efac" font-weight="600">1.8s</tspan> on MediaTek G99 edge chip</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- FOOTER CAPTION STRIP                                                -->
  <!-- =================================================================== -->
  <g transform="translate(36, 595)">
    <text x="0" y="11" font-size="9" fill="#64748b">
      Open Health Stack (OHS) Labs • Empirical Verification across 30 Level-2 Multi-Morbidity Frontline Pediatric &amp; Maternal Collisions (Kenya eCHIS Protocols).
    </text>
  </g>
</svg>