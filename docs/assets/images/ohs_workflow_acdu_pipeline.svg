<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="100%" height="100%" style="background-color: #0c1017; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Clean Matte Canvas -->
  <rect width="1140" height="540" fill="#0c1017" />
  <rect width="1138" height="538" x="1" y="1" rx="6" fill="none" stroke="#1f2838" stroke-width="1" />

  <!-- =================================================================== -->
  <!-- FIGURE TITLE                                                        -->
  <!-- =================================================================== -->
  <g transform="translate(32, 24)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.2">
      Figure 1 | Open Health Stack: Edge Clinical Reasoning Architecture
    </text>
    <text x="0" y="30" font-size="11" font-weight="400" fill="#94a3b8">
      Division of labor: Context projection, deterministic protocol logic ($apply), aCDU safety floor, and edge SLM synthesis.
    </text>
  </g>

  <line x1="32" y1="64" x2="1108" y2="64" stroke="#1e2838" stroke-width="1" />

  <!-- =================================================================== -->
  <!-- 1. PATIENT EHR RECORD (INPUT)                                       -->
  <!-- =================================================================== -->
  <g transform="translate(32, 80)">
    <rect width="210" height="430" rx="6" fill="#131924" stroke="#253144" stroke-width="1" />
    
    <!-- Header -->
    <rect x="10" y="10" width="190" height="24" rx="4" fill="#1b2333" />
    <text x="18" y="26" font-size="10.5" font-weight="700" fill="#f8fafc">1. PATIENT EHR STATE</text>

    <text x="14" y="52" font-size="12" font-weight="700" fill="#f8fafc">FHIR R4 Patient Bundle</text>
    <text x="14" y="66" font-size="10" fill="#94a3b8">Raw clinical data (~1,840 tokens)</text>

    <!-- Resource items -->
    <g transform="translate(10, 80)">
      <rect width="190" height="42" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="10" y="17" font-size="10.5" font-weight="600" fill="#f8fafc">Patient Demographics</text>
      <text x="10" y="31" font-size="9.5" font-family="monospace" fill="#94a3b8">Age: 14m • Female • Kenya</text>

      <rect y="48" width="190" height="54" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="10" y="65" font-size="10.5" font-weight="600" fill="#f8fafc">Observation: Vitals</text>
      <text x="10" y="79" font-size="9.5" font-family="monospace" fill="#94a3b8">RR: 56 bpm (Fast breathing)</text>
      <text x="10" y="91" font-size="9.5" font-family="monospace" fill="#94a3b8">Temp: 39.4°C • Indrawing (+)</text>

      <rect y="108" width="190" height="42" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="10" y="125" font-size="10.5" font-weight="600" fill="#f8fafc">DiagnosticReport: Lab</text>
      <text x="10" y="139" font-size="9.5" font-family="monospace" fill="#94a3b8">mRDT: P. falciparum (+)</text>

      <rect y="156" width="190" height="54" rx="4" fill="#1e1820" stroke="#4a252d" stroke-width="1" />
      <text x="10" y="173" font-size="10.5" font-weight="600" fill="#fca5a5">Condition: Danger Sign</text>
      <text x="10" y="187" font-size="9.5" font-family="monospace" fill="#fca5a5">Convulsion (degedege)</text>
      <text x="10" y="199" font-size="9" font-family="monospace" fill="#e2e8f0">Status: Post-ictal lethargy</text>
    </g>

    <!-- Note -->
    <g transform="translate(10, 318)">
      <rect width="190" height="96" rx="4" fill="#151b27" stroke="#222d40" stroke-width="1" />
      <text x="10" y="18" font-size="9.5" font-weight="700" fill="#cbd5e1">WHY NOT SEND RAW TO LLM?</text>
      <text x="10" y="34" font-size="9" fill="#94a3b8">• 1,840 tokens overflows 2B RAM</text>
      <text x="10" y="48" font-size="9" fill="#94a3b8">• Naive RAG cuts apart contra-</text>
      <text x="10" y="61" font-size="9" fill="#94a3b8">  indications across pages</text>
      <text x="10" y="75" font-size="9" fill="#94a3b8">• Baseline score on collisions: 10%</text>
    </g>
  </g>

  <!-- Split Connectors -->
  <path d="M 242 175 L 268 175 L 268 150 L 288 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 242 360 L 268 360 L 268 360 L 288 360" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- 2A. TOP TRACK: SQL-ON-FHIR PROJECTION                               -->
  <!-- =================================================================== -->
  <g transform="translate(290, 80)">
    <rect width="230" height="175" rx="6" fill="#131924" stroke="#253144" stroke-width="1" />
    
    <rect x="10" y="10" width="210" height="24" rx="4" fill="#1b2333" />
    <text x="18" y="26" font-size="10.5" font-weight="700" fill="#f8fafc">2A. CONTEXT PROJECTION</text>

    <text x="12" y="52" font-size="12" font-weight="700" fill="#f8fafc">SQL-on-FHIR Views</text>
    <text x="12" y="66" font-size="10" fill="#94a3b8">Relational flattening &amp; relative dates</text>

    <g transform="translate(10, 76)">
      <rect width="210" height="48" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="8" y="16" font-size="9" fill="#cbd5e1">• Extracts flattened tabular rows from FHIR</text>
      <text x="8" y="30" font-size="9" fill="#cbd5e1">• Calculates relative ages and event times</text>
      <text x="8" y="42" font-size="9" fill="#cbd5e1">• Strips noisy JSON syntax and metadata</text>
    </g>

    <g transform="translate(10, 130)">
      <rect width="210" height="32" rx="4" fill="#18242c" stroke="#233544" stroke-width="1" />
      <text x="8" y="14" font-size="9.5" font-weight="700" fill="#f8fafc">Output: Markdown Briefing</text>
      <text x="8" y="26" font-size="9" font-family="monospace" fill="#94a3b8">180 tokens (10x token reduction)</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- 2B. BOTTOM TRACK: DETERMINISTIC LOGIC ($apply)                      -->
  <!-- =================================================================== -->
  <g transform="translate(290, 270)">
    <rect width="230" height="240" rx="6" fill="#131924" stroke="#253144" stroke-width="1" />
    
    <rect x="10" y="10" width="210" height="24" rx="4" fill="#1b2333" />
    <text x="18" y="26" font-size="10.5" font-weight="700" fill="#f8fafc">2B. DETERMINISTIC LOGIC</text>

    <text x="12" y="52" font-size="12" font-weight="700" fill="#f8fafc">OHS Workflow Library</text>
    <text x="12" y="66" font-size="10" fill="#94a3b8">$apply operation on PlanDefinitions</text>

    <g transform="translate(10, 76)">
      <rect width="210" height="66" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="600" fill="#cbd5e1">Rules in FHIRPath / CQL:</text>
      <text x="8" y="30" font-size="8.5" font-family="monospace" fill="#94a3b8">• Malaria: mRDT == '+' → FIRES</text>
      <text x="8" y="44" font-size="8.5" font-family="monospace" fill="#94a3b8">• Pneumonia: RR&gt;50 → FIRES</text>
      <text x="8" y="58" font-size="8.5" font-family="monospace" fill="#fca5a5">• Convulsion == true → FIRES (Tier 1)</text>
    </g>

    <g transform="translate(10, 148)">
      <rect width="210" height="80" rx="4" fill="#151d2a" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9.5" font-weight="700" fill="#f8fafc">Output: CarePlan Action Codes</text>
      <text x="8" y="31" font-size="8.5" font-family="monospace" fill="#94a3b8">1. IMCI-ACT-MAL-AL (Oral AL)</text>
      <text x="8" y="46" font-size="8.5" font-family="monospace" fill="#94a3b8">2. IMCI-REC-PNEU-AMOX (Oral Amox)</text>
      <text x="8" y="61" font-size="8.5" font-family="monospace" fill="#fca5a5">3. IMCI-REC-DANGER (Convulsion)</text>
      <text x="8" y="73" font-size="8" fill="#94a3b8">Deterministic recall: 100% @ 0.6ms</text>
    </g>
  </g>

  <!-- Connectors to Channel 3 -->
  <path d="M 520 168 L 546 168 L 546 220 L 568 220" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 520 390 L 546 390 L 546 320 L 568 320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- 3. aCDU SAFETY FLOOR & DEONTIC CLAMPING                             -->
  <!-- =================================================================== -->
  <g transform="translate(570, 80)">
    <rect width="260" height="430" rx="6" fill="#131924" stroke="#253144" stroke-width="1" />
    
    <rect x="10" y="10" width="240" height="24" rx="4" fill="#1b2333" />
    <text x="18" y="26" font-size="10.5" font-weight="700" fill="#f8fafc">3. aCDU SAFETY FLOOR</text>

    <text x="12" y="52" font-size="12" font-weight="700" fill="#f8fafc">Deontic Conflict Resolution</text>
    <text x="12" y="66" font-size="10" fill="#94a3b8">Fuses mandated actions with veto boundaries</text>

    <!-- Sub-step 1: Map codes -->
    <g transform="translate(10, 76)">
      <rect width="240" height="66" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="700" fill="#cbd5e1">1. Map Codes → Audited aCDUs (≤180 tok)</text>
      <text x="8" y="30" font-size="8.5" fill="#94a3b8">• Fuses positive protocol instructions with</text>
      <text x="8" y="44" font-size="8.5" fill="#94a3b8">  mandatory negative boundary constraints</text>
      <text x="8" y="58" font-size="8.5" fill="#94a3b8">• Stored in zero-RAM SQLite table (&lt;1 MB)</text>
    </g>

    <!-- Sub-step 2: Deontic Veto Resolver -->
    <g transform="translate(10, 148)">
      <rect width="240" height="130" rx="4" fill="#181d28" stroke="#313f56" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="700" fill="#f8fafc">2. Tier-1 Emergency Veto Resolver</text>
      <text x="8" y="30" font-size="9.5" font-family="monospace" fill="#cbd5e1">Invariant: R_safe = R_raw \ N_Tier1</text>
      
      <!-- STOP Box -->
      <rect x="8" y="38" width="224" height="42" rx="3" fill="#20151b" stroke="#682935" stroke-width="1" />
      <text x="12" y="53" font-size="8.5" font-family="monospace" font-weight="700" fill="#fca5a5">[VETO] "STOP: Do NOT give oral</text>
      <text x="12" y="67" font-size="8.5" font-family="monospace" font-weight="700" fill="#fca5a5">fluids or meds (aspiration hazard)"</text>

      <text x="8" y="96" font-size="8.5" font-weight="700" fill="#fca5a5">Deterministic Pruning Effect:</text>
      <text x="8" y="110" font-size="8.5" fill="#cbd5e1">Oral AL and oral Amox are stripped from prompt.</text>
      <text x="8" y="122" font-size="8" fill="#94a3b8">The model never receives the oral dosing options.</text>
    </g>

    <!-- Sub-step 3: Clamped Context Assembly -->
    <g transform="translate(10, 284)">
      <rect width="240" height="130" rx="4" fill="#151d2a" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="700" fill="#f8fafc">3. Clamped Context Prompt Assembly</text>
      
      <rect x="8" y="24" width="224" height="26" rx="3" fill="#182230" />
      <text x="12" y="40" font-size="8.5" fill="#cbd5e1">[Channel 2A] Markdown Patient Summary</text>

      <rect x="8" y="54" width="224" height="34" rx="3" fill="#182230" />
      <text x="12" y="68" font-size="8.5" fill="#cbd5e1">[Channel 3] Clamped Safe aCDU Directives</text>
      <text x="12" y="80" font-size="8" fill="#94a3b8">Recovery position; urgent transport; no oral fluids</text>

      <!-- Guarantee tag -->
      <rect x="8" y="94" width="224" height="28" rx="3" fill="#14221d" stroke="#1f4f3c" stroke-width="1" />
      <text x="12" y="108" font-size="8.5" font-weight="700" fill="#86efac">Safety Invariant Guaranteed</text>
      <text x="12" y="118" font-size="7.5" fill="#94a3b8">Model cannot hallucinate oral force-feeding</text>
    </g>
  </g>

  <!-- Connector to Channel 4 -->
  <path d="M 830 295 L 858 295" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- =================================================================== -->
  <!-- 4. ON-DEVICE 2B SLM (EDGE SYNTHESIS)                                -->
  <!-- =================================================================== -->
  <g transform="translate(860, 80)">
    <rect width="248" height="430" rx="6" fill="#131924" stroke="#253144" stroke-width="1" />
    
    <rect x="10" y="10" width="228" height="24" rx="4" fill="#1b2333" />
    <text x="18" y="26" font-size="10.5" font-weight="700" fill="#f8fafc">4. EDGE SLM SYNTHESIS</text>

    <text x="12" y="52" font-size="12" font-weight="700" fill="#f8fafc">Box 2: On-Device 2B SLM</text>
    <text x="12" y="66" font-size="10" fill="#94a3b8">Gemma4 2B / MedGemma 4B (&lt;1.9 GB RAM)</text>

    <g transform="translate(10, 76)">
      <rect width="228" height="44" rx="4" fill="#182030" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="600" fill="#cbd5e1">The Last-Mile Communicator:</text>
      <text x="8" y="28" font-size="8.5" fill="#94a3b8">• Does not diagnose or pick medical protocols</text>
      <text x="8" y="39" font-size="8.5" fill="#94a3b8">• Translates clamped safe actions into speech</text>
    </g>

    <!-- Script Output -->
    <g transform="translate(10, 126)">
      <rect width="228" height="206" rx="4" fill="#151d2a" stroke="#222d40" stroke-width="1" />
      <text x="8" y="16" font-size="9" font-weight="700" fill="#f8fafc">3-BULLET CHW ACTION SCRIPT:</text>

      <rect x="8" y="24" width="212" height="48" rx="3" fill="#182230" />
      <text x="12" y="38" font-size="8.5" font-weight="700" fill="#f8fafc">1. Recovery Position &amp; Airway</text>
      <text x="12" y="50" font-size="8" fill="#94a3b8">Turn child onto left side with neck clear.</text>
      <text x="12" y="61" font-size="8" fill="#94a3b8">Loosen tight clothing to keep airway open.</text>

      <rect x="8" y="78" width="212" height="54" rx="3" fill="#20151b" stroke="#502028" stroke-width="1" />
      <text x="12" y="92" font-size="8.5" font-weight="700" fill="#fca5a5">2. Strict Oral Medication Prohibition</text>
      <text x="12" y="104" font-size="8" fill="#fca5a5">Do NOT give oral pills, water, or herbs.</text>
      <text x="12" y="115" font-size="8" fill="#fca5a5">Giving oral fluids to a drowsy child causes</text>
      <text x="12" y="125" font-size="8" fill="#fca5a5">fatal pulmonary aspiration.</text>

      <rect x="8" y="138" width="212" height="48" rx="3" fill="#182230" />
      <text x="12" y="152" font-size="8.5" font-weight="700" fill="#f8fafc">3. Urgent Facility Transfer</text>
      <text x="12" y="164" font-size="8" fill="#94a3b8">Accompany caregiver immediately to Malindi</text>
      <text x="12" y="175" font-size="8" fill="#94a3b8">Hospital for injectable anticonvulsants.</text>

      <text x="8" y="198" font-size="8.5" font-weight="600" fill="#f8fafc">Accuracy: 10% → 60% (6x Lift on Collisions)</text>
    </g>

    <!-- Verification Card -->
    <g transform="translate(10, 338)">
      <rect width="228" height="76" rx="4" fill="#151d2a" stroke="#222d40" stroke-width="1" />
      <text x="8" y="15" font-size="9" font-weight="700" fill="#f8fafc">Empirical Benchmarks:</text>
      <text x="8" y="30" font-size="8.5" fill="#cbd5e1">• Safety Floor Recall: 100% Deterministic</text>
      <text x="8" y="43" font-size="8.5" fill="#cbd5e1">• Aspiration Error: 0.0% (Zero Hallucination)</text>
      <text x="8" y="56" font-size="8.5" fill="#cbd5e1">• Total RAM: &lt;1.9 GB (INT4 Quantized)</text>
      <text x="8" y="69" font-size="8.5" fill="#cbd5e1">• On-Device Latency: 1.8s (MediaTek G99)</text>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(32, 524)">
    <text x="0" y="8" font-size="8.5" fill="#64748b">
      Open Health Stack (OHS) Labs • Empirical Verification across 30 Level-2 Multi-Morbidity Collisions (Kenya eCHIS Protocols).
    </text>
  </g>
</svg>